name: Windows validation

on:
  push:
    branches: [main, fix/pro-stabilization]
  pull_request:
    branches: [main]

jobs:
  test-and-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Build portable application
        run: python -m PyInstaller --noconfirm --clean --workpath build_v11 --distpath dist_final AreaGrab.spec
      - name: Verify executable exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist_final/AreaGrab/AreaGrab.exe")) { throw "Missing AreaGrab.exe" }
      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: AreaGrab-windows-onedir
          path: dist_final/AreaGrab/
